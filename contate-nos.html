<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contate-nos</title>
</head>
<body>

    <h1>Contate-nos</h1>

    <p>Entre em contato conosco preenchendo o formulário abaixo:</p>

    <form>
        <label>Nome:</label><br>
        <input type="text" name="nome" placeholder="Digite seu nome"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Digite seu email"><br><br>

        <label>Assunto:</label><br>
        <input type="text" name="assunto" placeholder="Digite o assunto"><br><br>

        <label>Mensagem:</label><br>
        <textarea name="mensagem" rows="6" cols="40" placeholder="Digite sua mensagem"></textarea><br><br>

        <button type="submit">Enviar</button>
    </form>
<p><a href="http://127.0.0.1:5500/index.html">curriculo</a></p>

</body>
</html>
